{% extends "base.html" %}

{% block conteudo %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h1 class="h3 mb-0">Clientes</h1>
  <a class="btn btn-primary" href="{{ url_for('clientes.novo') }}">Novo cliente</a>
</div>

<div class="card">
  <div class="card-body">
    <div class="row g-2 mb-3">
      <div class="col-md-8">
        <input type="search"
               name="busca"
               value="{{ busca }}"
               class="form-control"
               placeholder="Buscar por nome, documento ou e-mail..."
               hx-get="{{ url_for('clientes.listar') }}"
               hx-trigger="keyup changed delay:300ms, search"
               hx-target="#tabela-clientes"
               hx-swap="outerHTML"
               hx-include="[name='situacao']"
               hx-indicator="#carregando">
      </div>
      <div class="col-md-4">
        <select name="situacao"
                class="form-select"
                hx-get="{{ url_for('clientes.listar') }}"
                hx-target="#tabela-clientes"
                hx-swap="outerHTML"
                hx-include="[name='busca']">
          <option value="todos" {{ 'selected' if situacao == 'todos' }}>Todas as situacoes</option>
          <option value="ativos" {{ 'selected' if situacao == 'ativos' }}>Somente ativos</option>
          <option value="inativos" {{ 'selected' if situacao == 'inativos' }}>Somente inativos</option>
        </select>
      </div>
    </div>

    <div id="carregando" class="htmx-indicator text-muted small mb-2">Buscando...</div>

    {% include "clientes/_tabela.html" %}
  </div>
</div>
{% endblock %}
