<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ titulo }} | CRM</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token() }}"}'>

{% if current_user.is_authenticated %}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand fw-semibold" href="{{ url_for('main.index') }}">CRM</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#menu" aria-controls="menu" aria-expanded="false"
            aria-label="Alternar navegacao">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('main.index') }}">Painel</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('clientes.listar') }}">Clientes</a>
        </li>
      </ul>
      <ul class="navbar-nav">
        <li class="nav-item">
          <span class="navbar-text me-3">{{ current_user.nome }}</span>
        </li>
        <li class="nav-item">
          <a class="btn btn-outline-light btn-sm" href="{{ url_for('auth.logout') }}">Sair</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
{% endif %}

<main class="container pb-5">
  {% include "_mensagens.html" %}
  {% block conteudo %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htmx.org@1.9.12/dist/htmx.min.js"></script>
<script src="{{ url_for('static', filename='js/mascaras.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
